
  <div class="container">
    <h2>Create account</h2>
    <p class="subtitle">Welcome to our community!</p>

    <form>
      <label for="email">Your email</label>
      <input type="email" id="email" placeholder="mymail@mail.com" />

      <label for="password">Password</label>
      <div class="input-wrapper">
        <input type="password" id="password" />
        <span class="eye-icon">👁️</span>
      </div>

      <label for="repeat-password">Repeat Password</label>
      <div class="input-wrapper">
        <input type="password" id="repeat-password" />
        <span class="eye-icon">👁️</span>
      </div>

      <button type="submit" class="register-btn">Register</button>

      <div class="checkbox">
        <input type="checkbox" id="agree" />
        <label for="agree">I agree with <a href="#">Terms & Conditions</a></label>
      </div>

      <div class="divider">Registration with social media</div>

      <div class="social-buttons">
        <button class="google-btn"><span> <i class="fab fa-google"></i></span> Google</button>
        <button class="facebook-btn"><i class="fab fa-facebook-f"></i> Facebook</button>
      </div>

      <p class="login-link">
        I already have an account, to <a href="#">Login Page</a>
      </p>
    </form>
  </div>
